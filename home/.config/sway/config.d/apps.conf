# ---------------------------------------------------------------------------
# Purpose: Per-application rules and workspace assignments. Use `assign` and
#          `for_window` blocks to control placement and floating behavior for
#          specific applications.
# ---------------------------------------------------------------------------

assign {
    [app_id="librewolf"] "11:🌐:1"
    [app_id="brave-browser"] "12:🌐:2"
    [app_id="slack"] "31:💬:1"
    [app_id="google-chrome"] "41:🍞:1"
}

for_window {
    [window_role="pop-up"] floating enable
    [window_role="floating_con"] floating enable
    [window_role="bubble"] floating enable
    [window_role="dialog"] floating enable
    [window_type="dialog"] floating enable
    [title="discord.com/popout"] floating enable, border pixel 2
    [title="Huddle"] floating enable, border pixel 2
}



# -------------------------------------------------------------------------
# Purpose: Commands to run when Sway starts or the config is reloaded. Use
#          `exec` and `exec_always` for daemons, environment imports, and
#          notifications that should be triggered on (re)load.
# -------------------------------------------------------------------------

exec_always "~/.config/sway/scripts/exec_dunst.sh"
exec_always "~/.config/sway/scripts/exec_kanshi.sh"
exec "~/bin/change-sway-bg.sh --auto"

exec_always "sleep 1; notify-send --app-name 'sway' 'Sway config reloaded'"

# Manual home screen:
#   swaymsg output "'ViewSonic Corporation VA2719-2K UZJ194220782'" enable position 1920 0
#   swaymsg output eDP-1 disable
#   swaymsg output eDP-1 enable

# 1. Provide immediate answers to the GTK portal (Prevents the 30s hang)
exec_always gsettings set org.gnome.desktop.interface gtk-theme 'Adwaita'
exec_always gsettings set org.gnome.desktop.interface icon-theme 'Adwaita'
exec_always gsettings set org.gnome.desktop.interface font-name 'Sans 10'
exec_always gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'

# 2. Update environment for systemd/dbus
# We include XDG_CURRENT_DESKTOP=sway to ensure it finds sway-portals.conf
exec systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=sway

# 3. Restart the Master Portal
# This kills any hung processes from GDM and starts a fresh one that sees Sway
exec systemctl --user restart xdg-desktop-portal

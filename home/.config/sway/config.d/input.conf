# ---------------------------------------------------------------------------
# Purpose: Configure input devices (keyboards, touchpads, mice). Settings such
#          as tapping, natural scroll, keyboard layout and xkb options are set
#          here so they can be reused and kept separate from other logic.
# ---------------------------------------------------------------------------

input "1739:53259:VEN_06CB:00_06CB:D00B_Touchpad" {
    dwt enabled
    tap enabled
    natural_scroll enabled
    middle_emulation enabled
}

input "type:keyboard" {
    xkb_layout us
    xkb_variant altgr-intl
    xkb_options ctrl:nocaps
}

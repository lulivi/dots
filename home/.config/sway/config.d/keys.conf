# ---------------------------------------------------------------------------
# Purpose: Keybindings for Sway. This file contains `bindsym` blocks and modes
#          (e.g. resize) to map keyboard shortcuts to actions, program launchers
#          and workspace management.
# ---------------------------------------------------------------------------

bindsym {
    # Kill focused window
    $mod+Shift+q kill

    # Reload the configuration file
    $mod+Shift+r reload

    # Exit sway (logs you out of your Wayland session)
    $mod+Shift+p exec swaynag -t warning \
        -m 'You pressed the exit shortcut. Do you really want to exit sway? This will end your Wayland session.' \
        -B 'Yes, exit sway' 'swaymsg exit'

    # Programs
    $mod+Return exec $term
    $mod+Space exec ~/bin/rofillo
    $mod+Shift+Space exec ~/bin/bookmarks
    $mod+Control+Space exec ~/bin/shortcuts
    Print exec ~/bin/screenshot

    # Move your focus around
    $mod+$left focus left
    $mod+$down focus down
    $mod+$up focus up
    $mod+$right focus right
    $mod+q focus prev
    $mod+Control+q focus parent
    $mod+e focus next
    $mod+Control+e focus parent

    # Move the focused window with the same, but add Shift
    $mod+Shift+$left move left
    $mod+Shift+$down move down
    $mod+Shift+$up move up
    $mod+Shift+$right move right

    # Workspaces
    $mod+1 workspace number $ws11
    $mod+2 workspace number $ws21
    $mod+3 workspace number $ws31
    $mod+4 workspace number $ws41
    $mod+w exec swaymsg workspace number $(~/bin/swayws up)
    $mod+a exec swaymsg workspace number $(~/bin/swayws left)
    $mod+s exec swaymsg workspace number $(~/bin/swayws down)
    $mod+d exec swaymsg workspace number $(~/bin/swayws right)

    # Move focused container to workspace
    $mod+Shift+1 move container to workspace number $ws11
    $mod+Shift+2 move container to workspace number $ws21
    $mod+Shift+3 move container to workspace number $ws31
    $mod+Shift+4 move container to workspace number $ws41
    $mod+Shift+w exec swaymsg move container to workspace number $(~/bin/swayws up)
    $mod+Shift+a exec swaymsg move container to workspace number $(~/bin/swayws left)
    $mod+Shift+s exec swaymsg move container to workspace number $(~/bin/swayws down)
    $mod+Shift+d exec swaymsg move container to workspace number $(~/bin/swayws right)

    # Layout stuff
    $mod+b splith
    $mod+v splitv

    # Switch the current container between different layout styles
    $mod+z layout toggle split
    $mod+x layout stacking
    $mod+c layout tabbed

    # Make the current focus fullscreen
    $mod+f fullscreen

    # Toggle the current focus between tiling and floating mode
    $mod+Shift+f floating toggle

    # Toggle sticky mode
    $mod+y sticky toggle
}

# Drag floating windows by holding down $mod and left mouse button.
# Resize them with right mouse button + $mod.
# Despite the name, also works for non-floating windows.
# Change normal to inverse to use left mouse button for resizing and right
# mouse button for dragging.
floating_modifier $mod normal

mode "resize" {
    bindsym {
        $left resize shrink width 10px
        $down resize grow height 10px
        $up resize shrink height 10px
        $right resize grow width 10px

        Return mode "default"
        Escape mode "default"
    }
}
bindsym $mod+r mode "resize"
